---
name: 'Unit Tests'

on: [push, pull_request]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: registry.opensuse.org/devel/openqa/containers/os-autoinst_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: make test-t
