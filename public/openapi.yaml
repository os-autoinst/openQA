---
info:
  description: OpenQA WebAPI REST API
  license:
    name: GPL-2.0-or-later
  title: openQA API
  version: v1
openapi: 3.0.0
paths:
  /assets:
    get:
      description: >
        Returns a list of all assets present in the system. For each asset
        relevant information such as its id, name, timestamp of creation and
        type is included.
      operationId: listAssets
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: List assets
      tags:
        - assets
    post:
      description: >
        Register an asset given its name and type. Returns a code of 200 on
        success and of 400 on error.
      operationId: registerAsset
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                name:
                  type: string
                type:
                  type: string
              required:
                - type
                - name
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Register asset
      tags:
        - assets
  /assets/cleanup:
    post:
      description: >
        Returns a list of all assets present in the system. For each asset
        relevant information such as its id, name, timestamp of creation and
        type is included.
      operationId: triggerAssetCleanup
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Trigger asset cleanup
      tags:
        - assets
  /assets/{id}:
    delete:
      description: >
        Removes an asset from the system given its id or its type and name.
        Returns the number of assets removed.
      operationId: deleteAssetById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete asset by id
      tags:
        - assets
    get:
      description: >
        Returns information for a specific asset given its id or its type and
        name. Information returned the asset id, name, timestamp of creation
        and type. Returns a code of 200 on success and of 404 on error.
      operationId: getAssetById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: Get asset by id
      tags:
        - assets
  /assets/{type}/{name}:
    delete:
      description: >
        Removes an asset from the system given its id or its type and name.
        Returns the number of assets removed.
      operationId: deleteAssetByName
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete asset by type and name
      tags:
        - assets
    get:
      description: >
        Returns information for a specific asset given its id or its type and
        name. Information returned the asset id, name, timestamp of creation
        and type. Returns a code of 200 on success and of 404 on error.
      operationId: getAssetByName
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      summary: Get asset by type and name
      tags:
        - assets
  /auth:
    get:
      description: Returns the job id of the current job.
      operationId: authCheck
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Auth check
      tags:
        - users
  /barrier:
    post:
      description: >
        Creates a new barrier resource for a group of tasks referenced by the
        argument "tasks". Returns 200 on success and 409 on error.
      operationId: createBarrier
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Create barrier
      tags:
        - locks
  /barrier/{name}:
    delete:
      description: Removes a barrier given its name.
      operationId: destroyBarrier
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Destroy barrier
      tags:
        - locks
    post:
      description: >
        Blocks execution of the calling job until the method is called by all
        tasks using the barrier referenced by "name". Returns a 200 code on
        success, 409 on error and 410 when the referenced barrier does not
        exist.
      operationId: waitBarrier
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Wait at barrier
      tags:
        - locks
  /bugs:
    get:
      description: >
        Returns a dictionary of bugs reported in the system of the form { id:
        bug } where the key is the ID in the database and the value is the
        external bug, eg. bsc#123 or poo#123. The optional parameter
        "refreshable" limits the results to bugs not updated recently. Bugs
        that were already checked and don''t actually exist in the bugtracker
        are not returned as there are no updates on non-existent bugs expected.
        Additionally "delta" can be set to a timespan, 1 hour by default. The
        optional parameter "...'
      operationId: listBugs
      parameters:
        - in: query
          name: refreshable
          schema:
            type: integer
        - in: query
          name: delta
          schema:
            type: integer
        - in: query
          name: created_since
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: List bugs
      tags:
        - bugs
    post:
      description: >
        Creates a new bug in the system. This method will check for the
        existence of a bug with the same external bug id, in which case the
        method fails with an error code of 1. Otherwise, the new bug is created
        with the bug values passed as arguments.
      operationId: createBug
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                assigned:
                  type: integer
                assignee:
                  type: string
                bugid:
                  type: string
                existing:
                  type: integer
                open:
                  type: integer
                priority:
                  type: string
                refreshed:
                  type: integer
                resolution:
                  type: string
                status:
                  type: string
                title:
                  type: string
              required:
                - bugid
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Create bug
      tags:
        - bugs
  /bugs/{id}:
    delete:
      description: >
        Removes a bug from the system given its bug id. Return 1 on success or
        not found on error.
      operationId: deleteBug
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete bug
      tags:
        - bugs
    get:
      description: >
        Returns information for a bug given its id in the system. Information
        includes the internal (openQA-specific) and the external bug id. Also
        shows the bug's title, priority, whether its assigned or not and its
        assignee, whether its open or not, status, resolution, whether its an
        existing bug or not, and the date when the bug was last updated in the
        system.
      operationId: getBug
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: Get bug
      tags:
        - bugs
    put:
      description: >
        Updates the information of a bug given its id and a set of bug values
        to update. Returns the id of the bug, or an error if the bug id is not
        found in the system.
      operationId: updateBug
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                assigned:
                  type: integer
                assignee:
                  type: string
                existing:
                  type: integer
                open:
                  type: integer
                priority:
                  type: string
                refreshed:
                  type: integer
                resolution:
                  type: string
                status:
                  type: string
                title:
                  type: string
              type: object
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Update bug
      tags:
        - bugs
  /comments:
    delete:
      description: >
        Deletes multiple comments by their IDs which are specified by passing
        one or more `id` parameters. Returns a JSON object with the number of
        deleted comments or an error message in case a fatal error occurred.
        Returns a 200 code when all comments have been deleted and a 400 code
        if not all comments could be deleted.
      operationId: deleteComments
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                id:
                  items:
                    type: integer
                  type: array
              required:
                - id
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete multiple comments
      tags:
        - comments
    post:
      description: >
        Adds new comments to the specified jobs. Returns 200 if all comments
        have been created or 400 if not all comments could be created. Returns
        a JSON object with the created and failed comment IDs or an error
        message in case a fatal error occurred. All comments will have the same
        text which is passed via the mandatory `text` parameter. At this point
        only job comments are supported. The job IDs are specified by passing
        one or more `job_id` parameters.
      operationId: createComments
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                job_id:
                  items:
                    type: integer
                  type: array
                text:
                  type: string
              required:
                - text
                - job_id
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Create comments for multiple jobs
      tags:
        - comments
  /experimental/isos/note:
    put:
      description: >
        Adds/updates a note on the latest scheduled product matching the
        specified DISTRI, VERSION, FLAVOR, ARCH and BUILD parameters. This note
        is shown on the web UI. The ID of the scheduled product where the note
        was added/updated is returned, e.g. `{updated_product_id: 42}`.
      operationId: updateIsoNote
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                arch:
                  type: string
                build:
                  type: string
                distri:
                  type: string
                flavor:
                  type: string
                note:
                  type: string
                version:
                  type: string
              required:
                - note
                - distri
                - version
                - flavor
                - arch
                - build
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Update scheduled product note
      tags:
        - isos
  /experimental/job_templates_scheduling/{id_or_name}:
    get:
      description: >
        Serializes the given job group with relevant test suites by
        architecture and products (mediums), or all available groups defined in
        the system if no group id is specified. Common defaults for prio and
        machine are represented in the defaults key. Returns a YAML template
        representing the job group(s).
      operationId: getJobTemplatesSchedulingExp
      parameters:
        - in: path
          name: id_or_name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      summary: Get job templates scheduling (experimental)
      tags:
        - job_templates
    post:
      operationId: updateJobTemplatesSchedulingExp
      parameters:
        - in: path
          name: id_or_name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Update job templates scheduling (experimental)
      tags:
        - job_templates
  /experimental/search:
    get:
      operationId: search
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: OK
      summary: Search
      tags:
        - jobs
  /feature:
    post:
      description: >
        Post integer value to save feature version of current user in the
        database
      operationId: informedAboutFeature
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Mark feature as informed
      tags:
        - users
  /groups/{group_id}/comments:
    get:
      description: >
        Returns a list of comments for a job or a job group given its id. For
        each comment the list includes its bug references, date of creation,
        comment id, text, date of update and the user name that created the
        comment. Add the optional "render_markdown=1" parameter to include the
        rendered markdown text for each comment.
      operationId: listGroupComments
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
        - in: query
          name: render_markdown
          schema:
            type: boolean
      responses:
        '200':
          description: OK
      summary: List comments for group
      tags:
        - comments
    post:
      description: >
        Adds a new comment to the specified job/group. Returns a 200 code with
        a JSON containing the new comment id or 400 if no text is specified for
        the comment.
      operationId: createGroupComment
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                text:
                  type: string
              required:
                - text
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Create comment for group
      tags:
        - comments
  /groups/{group_id}/comments/{comment_id}:
    delete:
      description: >
        Deletes an existing comment specified by job/group id and comment id.
      operationId: deleteGroupComment
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
        - in: path
          name: comment_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete comment for group
      tags:
        - comments
    get:
      description: >
        Renders text and properties for a comment specified by job/group id and
        comment id including rendered markdown and bug references. Returns a
        404 code if the specified comment does not exist, or 200 on success.
      operationId: getGroupComment
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
        - in: path
          name: comment_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: Get comment for group
      tags:
        - comments
    put:
      description: >
        Updates an existing comment specified by job/group id and comment id.
        An update text argument is required. Returns a 200 code and a JSON on
        success and 400 if no text was specified, 404 if the comment to update
        does not exist and 403 if the update is not requested by the original
        author of the comment.
      operationId: updateGroupComment
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
        - in: path
          name: comment_id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                text:
                  type: string
              required:
                - text
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Update comment for group
      tags:
        - comments
  /isos:
    post:
      description: >
        Schedule jobs for assets matching the required settings DISTRI,
        VERSION, FLAVOR and ARCH passed to the method as arguments. Returns a
        JSON block containing the number of jobs created, their job ids and the
        information for jobs that could not be scheduled. Supports an optional
        `_FAIL_IF_NO_JOBS` parameter. When set to `1`, the request fails with
        a `400 Bad Request` if no jobs are scheduled (unless `async=1` is
        used). In either case, the scheduled product status is set to
        `fatal_error`.
      operationId: createIso
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                ARCH:
                  type: string
                BUILD:
                  type: string
                DISTRI:
                  type: string
                FLAVOR:
                  type: string
                ISO:
                  type: string
                MACHINE:
                  type: string
                TEST:
                  type: string
                VERSION:
                  type: string
              required:
                - DISTRI
                - VERSION
                - FLAVOR
                - ARCH
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Create jobs from ISO
      tags:
        - isos
  /isos/job_stats:
    get:
      description: >
        Returns job statistics about the most recent scheduled products
        matching the specified DISTRI, VERSION, FLAVOR, ARCH and BUILD
        parameters. Scheduled products that are cancelling/cancelled are not
        considered. This allows determining whether all jobs that have been
        scheduled for a certain purpose are done and whether the jobs have
        passed. If jobs have been cloned/restarted then only the state/result
        of the latest job is taken into account. The statistics are returned as
        nested JSON object with ...
      operationId: getIsoJobStats
      parameters:
        - in: query
          name: distri
          required: true
          schema:
            type: string
        - in: query
          name: version
          required: true
          schema:
            type: string
        - in: query
          name: flavor
          required: true
          schema:
            type: string
        - in: query
          name: arch
          required: true
          schema:
            type: string
        - in: query
          name: build
          required: true
          schema:
            type: string
        - in: query
          name: group_glob
          schema:
            type: string
        - in: query
          name: not_group_glob
          schema:
            type: string
        - in: query
          name: additional_jobs_by
          schema:
            type: string
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Get job statistics for ISOs
      tags:
        - isos
  /isos/{name}/cancel:
    post:
      description: >
        Cancel jobs whose ISO setting match a particular ISO argument passed to
        the method. Return number of cancelled jobs within a JSON block.
      operationId: cancelIso
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                BUILD:
                  type: string
              type: object
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Cancel jobs for ISO
      tags:
        - isos
  /isos/{scheduled_product_id}:
    delete:
      operationId: deleteIso
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete ISO scheduled product
      tags:
        - isos
    get:
      description: >
        Returns (status) information and jobs for a previously scheduled
        product via create().
      operationId: getScheduledProduct
      parameters:
        - in: path
          name: scheduled_product_id
          required: true
          schema:
            type: integer
        - in: query
          name: include_job_ids
          schema:
            type: boolean
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Get scheduled product
      tags:
        - isos
  /job_groups:
    get:
      description: >
        Shows a list jobs belonging to a job group given its ID, or a list of
        all jobs. For each job in the list, all relevant information - with the
        exception of timestamps - is also returned as a list of indexed lists.
      operationId: listJobGroups
      responses:
        '200':
          description: OK
      summary: List job groups
      tags:
        - job_groups
    post:
      description: The name of the group to be created.
      operationId: createJobGroup
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                always_show_version:
                  type: integer
                build_version_sort:
                  type: integer
                carry_over_bugrefs:
                  type: integer
                default_priority:
                  type: integer
                description:
                  type: string
                ignore_on_dashboard:
                  type: integer
                keep_important_jobs_in_days:
                  type: integer
                keep_important_logs_in_days:
                  type: integer
                keep_important_results_in_days:
                  type: integer
                keep_jobs_in_days:
                  type: integer
                keep_logs_in_days:
                  type: integer
                keep_results_in_days:
                  type: integer
                name:
                  type: string
                parent_id:
                  type: string
                size_limit_gb:
                  type: string
              required:
                - name
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Create job group
      tags:
        - job_groups
  /job_groups/{group_id}:
    delete:
      description: >
        Deletes a job group. Verifies that it is empty before attempting to
        remove. If not empty (there are existing jobs), it will return an
        error.
      operationId: deleteJobGroup
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete job group
      tags:
        - job_groups
    get:
      description: >
        Shows a list jobs belonging to a job group given its ID, or a list of
        all jobs. For each job in the list, all relevant information - with the
        exception of timestamps - is also returned as a list of indexed lists.
      operationId: getJobGroup
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: Get job group
      tags:
        - job_groups
    put:
      description: Updates the properties of a job group.
      operationId: updateJobGroup
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                always_show_version:
                  type: integer
                build_version_sort:
                  type: integer
                carry_over_bugrefs:
                  type: integer
                default_priority:
                  type: integer
                description:
                  type: string
                drag:
                  type: integer
                ignore_on_dashboard:
                  type: integer
                name:
                  type: string
                parent_id:
                  type: string
                size_limit_gb:
                  type: string
                sort_order:
                  type: integer
              type: object
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Update job group
      tags:
        - job_groups
  /job_groups/{group_id}/build_results:
    get:
      description: >
        Shows build results for a job group, similar to what the group_overview
        page provides. Currently it does not support parent job groups. Use
        limit_builds=n to limit the number of returned builds. Default is 10.
        Use time_limit_days=n to only go back n days. Use only_tagged=1 to only
        return tagged builds. Use show_tags=1 to show tags for each build.
        only_tagged implies show_tags.
      operationId: getJobGroupBuildResults
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
        - in: query
          name: limit_builds
          required: false
          schema:
            type: integer
        - in: query
          name: time_limit_days
          required: false
          schema:
            type: integer
        - in: query
          name: only_tagged
          required: false
          schema:
            type: boolean
        - in: query
          name: show_tags
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OK
      summary: Get build results for job group
      tags:
        - job_groups
  /job_groups/{group_id}/jobs:
    get:
      description: List jobs belonging to a job group.
      operationId: getJobGroupJobs
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
        - in: query
          name: expired
