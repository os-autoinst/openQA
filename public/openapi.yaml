        exactly. The scheduled product is always created asynchronously. This
        function does not handle the "closed" or "cancel" action yet. It would
        make sense to abort an existing scheduled product in this case. This
        function does not handle the "push" or "synchronize" actions yet. It
        would make...
      operationId: evaluateWebhookProduct
      responses:
        '200':
          description: OK
      security:
        - api_key: []
