                  type: string
                cpu_opmode:
                  type: string
                developer_connection_hint:
                  type: string
                host:
                  type: string
                instance:
                  type: string
                isotovideo_interface_version:
                  type: string
                job_id:
                  type: string
                mem_max:
                  type: integer
                parallel_one_host_only:
                  type: integer
                websocket_api_version:
                  type: integer
                worker_class:
                  type: string
              required:
                - host
                - instance
                - cpu_arch
                - mem_max
                - worker_class
              type: object
        required: true
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Create/register worker
      tags:
        - workers
  /workers/{workerid}:
    delete:
      description: >
        Deletes a worker which currently has the status "dead" and no job
        assigned to it. An error is returned if the worker doesn't exist or has
        a different status.
      operationId: deleteWorker
      parameters:
        - in: path
          name: workerid
          required: true
          schema:
            type: integer
        - in: query
          name: force
          schema:
            type: integer
      responses:
        '200':
          description: OK
      security:
        - api_key: []
      summary: Delete worker
      tags:
        - workers
    get:
      description: >
        Prints information from a worker given its ID. Each entry contains the
        "hostname" and the field "status" which can be "dead", "idle",
        "running" and "broken". A worker can be considered online when the
        status is not "dead". Broken means that the worker is able to connect
        but there is some setup problem on the worker host preventing it from
        taking jobs.
      operationId: getWorker
      parameters:
        - in: path
          name: workerid
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: Get worker
      tags:
        - workers
