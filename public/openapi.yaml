        its ID, the host where the worker is located, the worker instance, the
        worker status and the worker's websocket status.
      operationId: listWorkers
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
        - in: query
          name: reserved
          schema:
            type: integer
      responses:
        '200':
          description: OK
      summary: List workers
      tags:
        - workers
