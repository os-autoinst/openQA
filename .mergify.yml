pull_request_rules:
  - name: automatic merge
    conditions:
      - and: &base_checks
          - and: &core_checks
              - base=master
              - -label~=^acceptance-tests-needed|not-ready
              # wait explicitly for one of the final checks to show up to be on the
              # safe side even in case of checks not reporting back at all
              - status-success=codecov/project
              - status-success=codecov/patch
              - status-success=static-check-containers
              - status-success=webui-docker-compose
              - '#check-failure=0'
              - linear-history
          # Multibuild results will not report the "pending" status:
          # https://openbuildservice.org/help/manuals/obs-user-guide/cha.obs.scm_ci_workflow_integration.html#sec.obs.obs_scm_ci_workflow_integration.setup.status_reporting
          # "unresolvable" is not reported in general:
          # https://trello.com/c/0N3jHq5M/2257-report-back-to-scm-when-build-results-arent-failed-and-succeeded
          # So we need to require the number of tests explicitly:
          - '#check-success>=39'
          # the openQA-in-openQA checks are not configured yet, the PR adding them
          # is still under discussion, see https://progress.opensuse.org/issues/208764
          # - status-success=openqa-in-openqa-tests
          - '#check-pending=0'
      - and:
          - '#approved-reviews-by>=2'
          - '#changes-requested-reviews-by=0'
          # https://doc.mergify.io/examples.html#require-all-requested-reviews-to-be-approved
          - '#review-requested=0'
          - -label~=^merge-skip-|merge-fast
    actions: &merge
      merge:
        method: merge
  - name: automatic merge on special label
    conditions:
      - and: *base_checks
      - label=merge-fast
      - -label~=^merge-skip-
    actions: *merge
  - name: automatic merge on merge-skip-oqa-in-oqa-tests
    conditions:
      - and: *core_checks
      - '#check-success>=39'
      - label=merge-skip-oqa-in-oqa-tests
      - -label=merge-skip-extended-tests
    actions: *merge
  - name: automatic merge on merge-skip-obs-tests
    conditions:
      - and: *core_checks
      # see comment about the openQA-in-openQA checks above
      # - status-success=openqa-in-openqa-tests
      - label=merge-skip-obs-tests
      - -label=merge-skip-extended-tests
    actions: *merge
  - name: automatic merge on merge-skip-extended-tests
    conditions:
      - and: *core_checks
      - label=merge-skip-extended-tests
    actions: *merge
  - name: automatic merge for dependency bot updates
    conditions:
      - and: *base_checks
      - author~=^os-autoinst-bot$
    actions: *merge
  - name: automatic merge for dependabot updates
    conditions:
      - and: *base_checks
      - and:
          - base=master
          - author=dependabot[bot]
    actions:
      merge:
        method: squash
queue_rules: []
merge_queue:
  status_comments: none
  queue_controls_comment: false
