---
name: check-helm-chart
# yamllint disable-line rule:truthy
on:
  # a branch push inside the repository must not bypass the gate of its pull request
  push:
    branches: [master]
  pull_request:
jobs:
  lint-chart:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.8.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.13

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510  # v2.9.0

      - name: Run chart-testing
        run: make test-helm-lint
  install-chart:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    needs: lint-chart
    env:
      REGISTRY_PATH: registry.opensuse.org/devel/openqa/containers16.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The install pulls images that are rebuilt from master, so unrelated PRs must not
      # be blocked by them. The remaining steps only fetch tooling; `Install retry`
      # tracks the moving `main` branch of okurz/retry and is accepted as-is
      - name: Check whether the chart install is relevant
        id: relevant
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEVANT: ^container/helm/|^tools/test_helm_chart$|^tools/retry$|^tools/pr_files_match$|^Makefile$|^\.github/workflows/check-helm-chart\.yml$
        run: echo "install=$(tools/pr_files_match "$PR_NUMBER" "$RELEVANT")" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.8.1

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: 3.13

      - name: Install retry
        run: |
          curl -sSfL https://raw.githubusercontent.com/okurz/retry/main/retry -o /usr/local/bin/retry
          chmod +x /usr/local/bin/retry

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510  # v2.9.0

      - name: Create kind cluster
        if: steps.relevant.outputs.install == 'true'
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376  # v1.15.2

      - name: Download images
        if: steps.relevant.outputs.install == 'true'
        run: |
          for i in webui worker; do
            retry -r 7 -s 15 -e docker pull $REGISTRY_PATH/openqa_$i:latest
          done

      - name: Load images into the Cluster
        if: steps.relevant.outputs.install == 'true'
        run: |
          docker exec chart-testing-control-plane crictl pull $REGISTRY_PATH/openqa_webui:latest
          docker exec chart-testing-control-plane crictl pull $REGISTRY_PATH/openqa_worker:latest

      - name: Run chart-testing
        if: steps.relevant.outputs.install == 'true'
        run: make test-helm-install
