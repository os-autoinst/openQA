---
# yamllint disable rule:line-length
name: openqa-pr-check

on:
  pull_request_target:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: false
        type: string

permissions:
  contents: read

env:
  OPENQA_HOST: ${{ secrets.OPENQA_URL || 'https://openqa.opensuse.org' }}
  OPENQA_API_KEY: ${{ secrets.OPENQA_API_KEY }}
  OPENQA_API_SECRET: ${{ secrets.OPENQA_API_SECRET }}
  OPENQA_GROUP_ID: ${{ secrets.OPENQA_GROUP_ID || '1' }}
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  openqa-in-openqa-tests:
    name: openqa-in-openqa-tests
    environment: openqa-pr-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: registry.opensuse.org/devel/openqa/containers/tumbleweed:client
    env:
      BUILD: PR-${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Validate environment
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Error: PR number must be numeric, got '$PR_NUMBER'"
            exit 1
          fi
          if [ -z "$OPENQA_API_KEY" ] || [ -z "$OPENQA_API_SECRET" ]; then
            echo "::error::OPENQA_API_KEY or OPENQA_API_SECRET not set in secrets."
            exit 1
          fi
      - name: Determine PR git source
        id: pr_source
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_CLONE_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -n "$HEAD_CLONE_URL" ]; then
            git_url="$HEAD_CLONE_URL#$HEAD_REF"
          else
            pr_data=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")
            clone_url=$(echo "$pr_data" | jq -r .head.repo.clone_url)
            ref=$(echo "$pr_data" | jq -r .head.ref)
            git_url="${clone_url}#${ref}"
          fi
          if [ -z "$git_url" ] || [[ "$git_url" == null#* || "$git_url" == *'#null' ]]; then
            echo "Error: Could not determine git URL for PR $PR_NUMBER"
            exit 1
          fi
          echo "git_url=$git_url" >> "$GITHUB_OUTPUT"
      - name: Fetch scenario definitions
        run: >-
          curl -sSfL
          https://raw.githubusercontent.com/os-autoinst/os-autoinst-distri-openQA/master/scenario-definitions.yaml
          -o scenario-definitions.yaml
      - name: Get latest build
        id: latest_build
        run: |
          build=$(openqa-cli api --host "$OPENQA_HOST" "job_groups/$OPENQA_GROUP_ID/build_results" only_tagged=1 | jq -r '[ .build_results[] | select(.tag.description=="published") | .build ][0] // empty')
          test -n "$build" || { echo "Error: no published build in job group $OPENQA_GROUP_ID"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Link to test result overview page
        run: |
          overview_url="$OPENQA_HOST/tests/overview?flavor=dev&build=$BUILD"
          echo "Overview URL: $overview_url"
          echo "### openQA-in-openQA Test Run" >> "$GITHUB_STEP_SUMMARY"
          echo "[$BUILD Overview]($overview_url)" >> "$GITHUB_STEP_SUMMARY"
      - name: Trigger and monitor openQA test
        env:
          OPENQA_GIT_URL: ${{ steps.pr_source.outputs.git_url }}
        run: >-
          openqa-cli schedule
          --monitor
          --host "$OPENQA_HOST"
          --apikey "$OPENQA_API_KEY" --apisecret "$OPENQA_API_SECRET"
          --param-file SCENARIO_DEFINITIONS_YAML=scenario-definitions.yaml
          DISTRI=openQA VERSION=Tumbleweed FLAVOR=dev ARCH=x86_64
          TEST=openqa_from_git
          HDD_1="opensuse-Tumbleweed-x86_64-${{ steps.latest_build.outputs.build }}-minimalx@uefi.qcow2"
          BUILD="$BUILD" _GROUP_ID=0
          _OBSOLETE=1 _ONLY_OBSOLETE_SAME_BUILD=1 _FORCE_OBSOLETE=1
          OPENQA_GIT_URL="$OPENQA_GIT_URL"
